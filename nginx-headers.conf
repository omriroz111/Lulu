# Lulu — nginx equivalent of .htaccess.
#
# Hand this to the host ONLY if they run nginx: nginx ignores .htaccess
# entirely, so without this the site ships with no security headers at all.
# On Apache / cPanel (the common case, including Register.co.il) the .htaccess
# in the site root already does this and nothing here is needed.
#
# Goes inside the server { } block for the site.

# ---------- force HTTPS ----------
# Assumes a separate listen 80 server block redirecting to https.

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;

# The site is static; the only third party is Google Fonts. 'unsafe-inline' is
# needed because each page carries a small inline <script> and inline <style>.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; frame-src https://www.google.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

# ---------- no directory listings ----------
autoindex off;

# ---------- keep source and notes off the web ----------
location ~ /\. { deny all; }
location ~* \.(md|py|json|log|bak|zip|conf)$ { deny all; }

# ---------- caching ----------
location ~* \.(css|js|jpg|jpeg|png|svg|woff2|ttf)$ {
  expires 1y;
  add_header Cache-Control "public, immutable";
}

# HTML must stay fresh so content edits appear immediately.
location ~* \.html$ {
  expires -1;
  add_header Cache-Control "no-cache";
}

gzip on;
gzip_types text/css application/javascript image/svg+xml text/html;

# friendly page instead of the server default
error_page 404 /404.html;
